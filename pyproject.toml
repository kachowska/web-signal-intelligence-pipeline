[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-signal-intelligence-pipeline"
version = "0.1.0"
description = "Incremental web-signal ETL and entity-resolution service for B2B data intelligence."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
websignal = "websignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
