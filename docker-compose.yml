services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: websignal
      POSTGRES_USER: websignal
      POSTGRES_PASSWORD: websignal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websignal -d websignal"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - websignal_pg:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://websignal:websignal@db:5432/websignal
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  websignal_pg:
